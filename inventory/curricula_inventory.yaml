  legal_basis:
    instrument: 'Erlasse of the MK published in the Schulverwaltungsblatt (SVBl.) and VORIS. Kerncurricula are ''Herausgegeben
      vom Niedersächsischen Kultusministerium''; their binding force follows from the school-form Erlasse (e.g. ''Die Arbeit
      in den Schuljahrgängen 5 bis 10 des Gymnasiums'', RdErl. d. MK v. 23.6.2015, 33-81011, SVBl. S. 301, last amended 19.5.2020,
      SVBl. S. 304, VORIS 22410: goals, content and methods ''sind in fachbezogenen Kerncurricula festgelegt'') and an Erlass
      on Curriculare Vorgaben (v. 01.10.2024, SVBl. S. 525; previously 1.10.2019, SVBl. S. 500). Individual KC Erlass/SVBl.
      references not captured; cuvo shows only ''gültig ab''.'
    paragraph_5_urhg_assessment: 'Abs. 2 likely (assessment, not legal advice): KC published by the MK in the official interest
      for general knowledge; Abs. 1 arguable only for the enacting Erlasse.'
    evidence_url: https://www.mk.niedersachsen.de/download/216505/250321_Synopse_alt_neu_einschl._Begruendung_Erl._Gy_5_10_.pdf.pdf
  licence_notice:
    text: No copyright or licence statement on cuvo.nibis.de (footer only Datenschutz and Impressum) or in the checked KC
      Mathematik Gymnasium PDF; NIBIS Impressum (NLQ) has liability and trademark notices only.
    url: https://wordpress.nibis.de/nibis/impressum-nibis/
    explicit_open_licence: false
  school_structure:
    primary_grades: 1-4 (Grundschule)
    sek1_school_forms:
    - Hauptschule
    - Realschule
    - Oberschule
    - Gymnasium
    - Integrierte Gesamtschule (IGS)
    - 'Kooperative Gesamtschule (KGS, schulzweigbezogen: uses HS/RS/Gym Kerncurricula)'
    gymnasium_model: G9 since 2015/16 (Sek I 5-10, Oberstufe Einführungsphase 11, Qualifikationsphase 12-13); IGS/KGS Oberstufe
      11-13.
    sek2_forms:
    - Gymnasiale Oberstufe am Gymnasium
    - Gymnasiale Oberstufe an der Gesamtschule (IGS/KGS)
    - Abendgymnasium / Kolleg (excluded)
    - Berufliches Gymnasium (excluded; shares Sek II KCs)
    integrated_science_lower_sek1: Sek I Kerncurricula Naturwissenschaften per school form bundle Biologie, Chemie, Physik
      as Fachteile; at Gymnasium, sciences in 5/6 may be taught integrated (Stundentafel footnote).
    chemistry_starts_grade: null
    physics_starts_grade: null
    stundentafel_url: 'unverified: Stundentafeln are Anlagen of the school-form Erlasse (e.g. ''Die Arbeit in den Schuljahrgängen
      5 bis 10 des Gymnasiums'', VORIS 22410); 2015 MK brochure verified: https://www.mk.niedersachsen.de/download/4834/Die_Arbeit_in_den_Schuljahrgaengen_5_-_10_des_Gymnasiums.pdf'
    weekly_hours_note: 'Gymnasium (2015 brochure) Mathematik Stundentafel 1: 4,4,4,4,3,4 = 23 hours over 5-10 (Stundentafel
      2: 22). Biologie, Chemie or Physik may each be reduced by one hour in total, not in Jg 10. Chemie/Physik start grades
      depend on school and Stundentafel; KC Naturwissenschaften sets competencies from Doppeljahrgang 5/6. Biologie: Sek I
      within the KC Naturwissenschaften (5-10), Sek II 11-13. Politik/Wirtschaft: Politik-Wirtschaft Gymnasium from Jg 8 (KC
      8-10); Politik Realschule 7-10 (HS presumably same); Wirtschaft HS/RS/OBS in Sek I; Gesellschaftslehre IGS. Arbeitslehre/WAT:
      AWT at IGS (Sek I); hours not extracted.'
