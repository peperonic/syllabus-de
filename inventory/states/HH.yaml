  legal_basis:
    instrument: "§ 4 HmbSG (Bildungspläne): Abs. 4 Bildungspläne are 'durch die zuständige Behörde für verbindlich erklärt' and to be published 'in allgemein zugänglicher Form'; the Senat may regulate the drafting procedure by Verordnung. HmbSG of 16.4.1997 (HmbGVBl. S. 97), last amended 27.5.2024 (HmbGVBl. S. 124). The Bekanntmachung/declaration text and date for the 2022-2024 plans were not located; publication is on hamburg.de, no Amtsblatt reference seen."
    paragraph_5_urhg_assessment: "Abs. 2 likely (assessment, not legal advice): plans declared binding and published to general notice by the Behörde; Abs. 1 arguable only for the declaring act."
    evidence_url: "https://dokumente.hamburg.de/resource/blob/670906/c44114c85332da6e1b53c083d3cacebc/hamburgisches-schulgesetz-hmbsg--data.pdf"
  licence_notice:
    text: "Plan PDFs print 'Alle Rechte vorbehalten' in the Impressum (checked: Allgemeiner Teil, Lernbereich NuT Stadtteilschule, Chemie Gymnasium). hamburg.de footer '© hamburg.de 2026'; Impressum mentions possible separate Nutzungsbedingungen for content of the Freie und Hansestadt Hamburg."
    url: "https://www.hamburg.de/impressum-240706"
    explicit_open_licence: false
  school_structure:
    primary_grades: "1-4 (Grundschule)"
    sek1_school_forms: ["Stadtteilschule (5-13)", "Gymnasium (5-12)"]
    gymnasium_model: "G8 at Gymnasium (Beobachtungsstufe 5-6, Mittelstufe 7-10, Studienstufe 11-12); Stadtteilschule Abitur after 13 (Vorstufe 11, Studienstufe 12-13)."
    sek2_forms: ["Studienstufe am Gymnasium", "Studienstufe an der Stadtteilschule", "Berufliches Gymnasium (excluded)", "Abendgymnasium / Hansa-Kolleg (excluded)"]
    integrated_science_lower_sek1: "Naturwissenschaften und Technik (NuT) integrated in Jg 5-6 at both Stadtteilschule and Gymnasium; Stadtteilschule may also teach 7-10 partly as interdisciplinary course following the Fachrahmenpläne; Naturwissenschaftliches Praktikum at Stadtteilschule."
    chemistry_starts_grade: 7
    physics_starts_grade: 7
    stundentafel_url: "https://www.hamburg.de/contentblob/3043146/43a9b2147359ac70445d8d4ac336fb1f/data/std-tafeln-stadtteilschule-gymnasium-sek-i.pdf"
    weekly_hours_note: "APO-GrundStGy Anlagen (old contentblob PDF, verified 2026-11-07; current consolidated version not checked): minimum totals 5-10, 45-min units: Gymnasium Mathematik 24, Naturwissenschaften/Technik (incl. Bio/Ch/Ph) 19; Stadtteilschule Mathematik 26, NuT 18 (bis Jg 9: 15). Biologie: separate from Jg 7 (5-6 within NuT) at both forms, Studienstufe. Politik/Wirtschaft: STS Lernbereich Gesellschaftswissenschaften integrated 5-10, PGW Fachrahmenplan 5-11; Gymnasium PGW in Sek I (grades not verified); PGW and Wirtschaft in the Studienstufe. Arbeitslehre/WAT: STS Berufliche Orientierung - Leben, Arbeit, Beruf (grades not verified)."
  portals:
