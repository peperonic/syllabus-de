  legal_basis:
    instrument: 'Bildungspläne put into force by the Kultusministerium; KM letters give entry-into-force dates (5 June 2024,
      Az. KM31-6510-1/9/25 for Deutsch/Mathematik V2; 22 July 2025, Az. KM31-6510-1/23/1 for V3.0 subjects incl. Chemie, Physik,
      Mathematik G9 from 1 Aug 2026). Plans contain an ''Inkraftsetzungsformel'' (per portal FAQ). Expected form: Verwaltungsvorschrift
      published in Amtsblatt ''Kultus und Unterricht'' (Lehrplanhefte); no K.u.U. citation retrieved (unverified).'
    paragraph_5_urhg_assessment: Abs. 1 arguable for the Bildungsplan text as amtlicher Erlass (assessment); portal nevertheless
      asserts 'Alle Rechte vorbehalten' (ZSL). Beispielcurricula and Umsetzungshilfen at most Abs. 2, more likely ordinary
      protected works.
