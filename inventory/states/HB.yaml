  curriculum_terms: ["Bildungsplan", "Bildungsplan 0 bis 10 (Elementar- und Primarbereich)", "Bildungsplanübersicht", "Erlass", "Mitteilung", "schulinternes Curriculum"]
  legal_basis:
    instrument: "Erlass (and pre-announcing Mitteilung) of the Senator für Kinder und Bildung; e.g. Erlass 3/2026 of 15.06.2026: 'werden die folgend tabellarisch aufgeführten Bildungspläne zum 01.08.2026 erlassen', publication on the LIS homepage. School-form Verordnungen delegate the standards to the Bildungspläne (Oberschulverordnung § 2 Abs. 3; Grundschulverordnung § 2), based on BremSchulG (§ 20 Abs. 3, § 21 Abs. 2, § 45 with § 42 and § 67 cited in the Oberschulverordnung). No Amtsblatt publication for plans seen."
    paragraph_5_urhg_assessment: "Abs. 1 arguable (the plan is the object 'erlassen' by the Erlass); Abs. 2 the safer reading (assessment, not legal advice)."
    evidence_url: "https://bildung.bremen.de/sixcms/media.php/13/erlass_3_2026.pdf"
  licence_notice:
    text: "No copyright notice in the checked 2025/2026 Bildungsplan PDFs (Mathematik 0-10, Mathematik OS, NaWi OS, NaWi GY). Rights notice on the LIS HTML pages not checked (index page blocked for the fetcher)."
    url: null
    explicit_open_licence: null
  school_structure:
    primary_grades: "1-4 (Grundschule)"
    sek1_school_forms: ["Oberschule (5-10, some with own gymnasiale Oberstufe 11-13)", "Gymnasium (durchgängig, Sek I 5-9)"]
    gymnasium_model: "G8 at Gymnasium (Sek I 5-9, gymnasiale Oberstufe 10-12 with Einführungsphase 10); Oberschule pupils reach Abitur after 13 (GyO 11-13)."
    sek2_forms: ["Gymnasiale Oberstufe am Gymnasium", "Gymnasiale Oberstufe an Oberschulen / Oberstufenzentren", "Berufliches Gymnasium (excluded)", "Erwachsenenschule (excluded)"]
    integrated_science_lower_sek1: "Oberschule: integrated Naturwissenschaft Jg 5-8, separate Biologie, Chemie, Physik Jg 9-10 (Oberschulverordnung § 4 Abs. 6; NaWi BP OS 2026). Gymnasium: integrated Naturwissenschaft Jg 5-6, separate subjects Jg 7-9 (NaWi BP GY 2026)."
    chemistry_starts_grade: 7
    physics_starts_grade: 7
    stundentafel_url: "https://www.bildung.bremen.de/sixcms/media.php/13/11094-Anlage%20169-2025_ANL%20verordnung-ueber-die-sekundarstufe-i-der-oberschule2025.pdf"
    weekly_hours_note: "Start grade 7 applies to Gymnasium; Oberschule starts separate Chemie/Physik in Jg 9. Oberschule Stundentafel (Anlage 1, consolidated 28.05.2025) minimum totals 5-10: Mathematik 22, Naturwissenschaft 12, Biologie 4, Chemie 2, Physik 4. Gymnasium Stundentafel not fetched. Biologie: Oberschule within Naturwissenschaft 5-8 and separate 9-10 (Stundentafel minimum Biologie 4 hours total); Gymnasium separate 7-9; GyO. Politik/Wirtschaft: Oberschule Gesellschaft und Politik 5-10; Gymnasium Welt- und Umweltkunde/Geschichte/Geografie/Politik; GyO Politik and Wirtschaftslehre. Arbeitslehre/WAT: WAT at Oberschule and Gymnasium Sek I (hours not extracted)."
