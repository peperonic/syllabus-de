- code: BB
  name: Brandenburg
  ministry:
    name: Ministerium für Bildung, Jugend und Sport des Landes Brandenburg (MBJS)
    url: https://mbjs.brandenburg.de/
  curriculum_institute:
    name: Landesinstitut Brandenburg für Schule und Lehrkräftebildung (since 1 Jan 2025; successor of the joint Berlin-Brandenburg
      LISUM), Struveweg, 14974 Ludwigsfelde-Struveshof
    abbrev: LIBRA
    url: https://libra.brandenburg.de
  curriculum_terms:
  - Rahmenlehrplan
  - RLP
  - Rahmenlehrplan 1-10 (Teil A, B, C)
  - Rahmenlehrplan für die gymnasiale Oberstufe (GOST)
  - curriculare Materialien
  - Vorläufiger Rahmenplan (1992, residual)
  legal_basis:
    instrument: Verwaltungsvorschrift über Rahmenlehrpläne, curriculare Materialien und Bildungsstandards an Schulen des Landes
      Brandenburg (VV-Rahmenlehrpläne-Bildungsstandards, VVRLPBilst) of 2 Oct 2025, Abl. MBJS/25 Nr. 23 S. 354, amended 5
      Jun 2026 (Abl. MBJS/26 Nr. 9 S. 90), in force 1 Aug 2025; basis § 10 Abs. 6 i.V.m. Abs. 3 and § 146 BbgSchulG; replaces
      VVRLPcM of 2019 (expired 1 Aug 2025). Anlagen list 'In Kraft gesetzte Curricula' with Inkraftsetzung dates.
    paragraph_5_urhg_assessment: 'Abs. 2 likely for the curriculum PDFs (assessment): the VV (itself Abs. 1) only incorporates
      the Rahmenlehrpläne by reference in its Anlagen and the Amtsblatt does not reproduce them; Abs. 1 arguable because they
      are made binding as content of a Verwaltungsvorschrift.'
    evidence_url: https://bravors.brandenburg.de/verwaltungsvorschriften/vvrlpbilst
  licence_notice:
    text: No copyright or licence statement on Bildungsserver Impressum or curriculum pages; no Creative Commons.
    url: https://bildungsserver.berlin-brandenburg.de/index.php?id=366
    explicit_open_licence: null
  school_structure:
    primary_grades: 1-6 (Grundschule; Schuleingangsphase 1-2; Naturwissenschaften 5-6; Leistungs- und Begabungsklassen at
      Gymnasium from grade 5 possible)
    sek1_school_forms:
    - Oberschule
    - Gesamtschule
    - Gymnasium
    gymnasium_model: G8 at Gymnasium (Abitur after grade 12), Gesamtschule and Oberschule paths lead to Abitur after grade
      13; label from general knowledge, not from a fetched regulation. New Sek I-V of 6 Aug 2026 (GVBl. II/26 Nr. 35) governs
      Sek I; old Sek I-V of 2 Aug 2007 still applies to grades 9-10 in 2026/27 and 2027/28.
    sek2_forms:
    - Gymnasiale Oberstufe am Gymnasium
    - Gymnasiale Oberstufe an Gesamtschulen
    - Berufliches Gymnasium / Oberstufenzentrum
    - Zweiter Bildungsweg (excluded)
    integrated_science_lower_sek1: Naturwissenschaften 5/6 in Grundschule (RLP Teil C Nawi 5-6); in Sek I, § 12 Abs. 1 Sek
      I-V allows Physik, Chemie, Biologie to be combined into Lernbereich Naturwissenschaften; Nawi 7-10 Teil C exists as
      Wahlpflicht
    chemistry_starts_grade: 7
    physics_starts_grade: 7
    stundentafel_url: https://bravors.brandenburg.de/verordnungen/sek_i_v/attachments/263150
    weekly_hours_note: 'Kontingentstundentafeln for 7/8 and 9/10 per subject (§ 11 Abs. 3 Sek I-V); Grundschule Anlage 1 of
      GV (https://bravors.brandenburg.de/verordnungen/gv). Hours not extracted (PDF annexes not opened). Sek I-V Anlage (Kontingent,
      as extracted): Lernbereich Naturwissenschaften (Biologie, Chemie, Physik) 9 h (7/8) and 8 h (9/10) at Gesamtschule/Oberschule,
      10 h and 10 h at Gymnasium; Lernbereich Gesellschaftswissenschaften (Geografie, Geschichte, Politische Bildung) 5 h
      and 7 h at Gesamtschule/Oberschule, 6 h and 9 h at Gymnasium; WAT 2 h and 4 h at Gesamtschule/Oberschule, 2 h and 2
      h at Gymnasium (https://bravors.brandenburg.de/fm/68/Anlage.243389.pdf). Biologie in grades 5-6 is part of Naturwissenschaften
      5/6, Politische Bildung part of Gesellschaftswissenschaften 5/6; WAT taught 5-10.'
