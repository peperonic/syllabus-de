      export_or_api: "None visible. Counter shows 123 entries but table is empty in plain fetches (also ?q=, ?category=2, ?category=4); list populated client-side."
      scraper_notes: "TYPO3. Old host lehrplaene.bildung-rp.de 302-redirects here. Use a headless browser or capture the XHR endpoint. PDFs live on static.bildung-rp.de/lehrplaene/<fach>/ (directory listing not available) and on bildung.rlp.de/fileadmin/... and ors.bildung-rp.de/fileadmin/... Gedruckte Ausgaben page: https://bildung.rlp.de/lehrplaene/gedruckte-ausgaben"
