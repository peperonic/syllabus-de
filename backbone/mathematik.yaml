# Backbone topics for Mathematik (curated). Primar to Abitur.
# Anchored on the KMK Leitideen (Sek I and II: L1 Zahl, L2 Messen, L3 Raum und Form,
# L4 Funktionaler Zusammenhang, L5 Daten und Zufall; Primar adds Muster und Strukturen).
# KMK documents are structure only: labels here are our own wording, not KMK text.
# grade_band is a typical placement across Länder, used for a warn-level plausibility
# check in S6, never as a fact about any one Land. requires must stay acyclic (S4 checks).
# Keywords are folded German terms used by check_exercise and the S5 candidate ranking;
# a trailing * matches any word with that prefix.
# competences: a lexicon of common task verbs (our own list). check_exercise uses it only to
# notice a verb that is missing from the Land's operator list; allowed verbs come from the plan.
