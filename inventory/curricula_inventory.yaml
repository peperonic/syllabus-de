    instrument: 'Not located. Expected: Verwaltungsvorschrift / Bekanntmachung des Ministeriums published in the Amtsblatt
      des Ministeriums für Bildung (archive bm.rlp.de/fileadmin/09/05_Service/Dokumente/Amtsblatt/Archiv/). Teilrahmenplan
