      (B 1-B 3); 6 Basiskonzepte (Struktur und Funktion; Stoff- und Energieumwandlung; Information und Kommunikation; Steuerung
      und Regelung; Individuelle Entwicklung; Evolutive Entwicklung); 4 verbindliche inhaltliche Bereiche: Lebewesen bestehen
      aus Zellen (Kennzeichen des Lebendigen, Zellen, Mitose, Meiose, Fotosynthese und Zellatmung, Enzymreaktion), Vielfalt
      und Veränderung von Lebewesen (Evolutionstheorie, Vererbung, genetische Variabilität, Angepasstheit, Artbildung, Verwandtschaft,
      Stammesgeschichte des Menschen), Der Mensch als Lebewesen (Organsysteme, Immunabwehr, Impfung, Gesundheitsbildung, Ernährung,
