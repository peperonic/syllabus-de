  notes: "Brandenburg and Berlin share the RLP 1-10 and the GOST RLP; Brandenburg phases the 2023 Mathematik revision in from 2023/24 (one year ahead of Berlin). The former VVRLPcM (2019) expired 1 Aug 2025 and was replaced by VVRLPBilst (2 Oct 2025). Residual 'Vorläufige Rahmenpläne' of 1992 remain listed for Bautechnik, Chemietechnik, Griechisch. Förderschwerpunkte, Berufsschule, Berufsfachschule, Fachoberschule and Fachschule have their own Anlagen in the VV and are excluded here. Additions 2026-11-07 (Biologie, Politik/Wirtschaft, Arbeitslehre/WAT): RLP 1-10 Teil C Biologie, Gesellschaftswissenschaften 5/6, Politische Bildung and WAT 5-10 (2015); GOST Teil C Biologie (2022), Politische Bildung 2022 (phasing out) and 2025 (in force 01.08.2026), Wirtschaftswissenschaft (2018 text). The Berlin-only SoWi-WiWi, Politikwissenschaft and Sozialwissenschaften plans are not Brandenburg subjects."
