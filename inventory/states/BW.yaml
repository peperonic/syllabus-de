      scraper_notes: "CMS 'bildungsplan-rebrush2024' (Landesportal design), server-rendered. Plan pages at /,Lde/<ID> with stable IDs: BP2016BW_ALLG_<SCHULART>_<FACH> (V1), suffix .V2 (V2), DE_BW_BILDUNGSPLAENE_GEN2X_BPBW_ALLG_<SCHULART>_<FACH>%28V3.0%29 (V3.0); SCHULART in GS, SEK1, GYM, GMSO. Index pages: Grundschule /,Lde/30877172, Gymnasium /,Lde/30823692, Sek I /,Lde/32179352, GMSO /,Lde/30877176. HTML plan text is the primary publication; no public PDF of V3.0 Fachpläne. Sub-section URL pattern not extracted."
