  notes: 'Full new generation of Rahmenpläne rolling out: Mathematik Grundschule 2024 (from 2024/25, old plan runs out 31.07.2027),
    Mathematik Orientierungsstufe 2026 (from 2026/27), Sek I Mathematik/Physik/Chemie and Sek II Chemie 2026 editions valid
    from 01.08.2027 aufwachsend; old Sek I plans valid until 31.07.2031, old Chemie Sek II until 31.07.2029. Status ''upcoming''
    marks plans published but not yet in force in Nov 2026; old Sek I plans are marked ''current'' because they still govern
    all cohorts until 2027/28. Excluded: Fachgymnasium/Abendgymnasium plans (RP_MA-FG-AG.pdf, RP_PHYS_FG_AG.pdf, RP_CHE_FG_AG.pdf),
    Rahmenpläne der Förderschulen, berufliche Bildungsgänge. Years of RP_PHYS_SEK2_Erprobungsfassung, RP_NaWi_OS, RP_PHYS_OS_Klasse-6
    and RP_GS_Sachunterricht not determined. No em dashes used. Additions 2026-11-07 (Biologie, Politik/Wirtschaft, Arbeitslehre/WAT):
    Biologie OS, Sek I old (bis 31.07.2031) and 2026 (ab 01.08.2027) for RegS and Gym, Sek II 2019 Erprobungsfassung (no 2026
    Sek II plan); Politische Bildung/Sozialkunde Sek I (ab 01.08.2023) and Sek II 2026 (ab 01.08.2026), old Sozialkunde Sek
    II and Geschichte und Politische Bildung Sek II (both bis 31.07.2027), Wirtschaft Sek II, Weltkunde and Gesellschaftswissenschaften
    (Erprobungsfassung) in the Orientierungsstufe; AWT Sek I 2023 plans (old plans expired 31.07.2026), Berufliche Orientierung
    Sek II. No 2026 editions for Sozialkunde Sek I or AWT. Excluded: Biologie FG/AG and FOS, Sozialkunde BS and BS/FOS, Geschichte
    Fachgymnasium.'
