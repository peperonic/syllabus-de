schema: ancillary-resources/v1
category: "open_and_curriculum_aligned_content"
resources:
  - name: "Serlo (serlo.org)"
    url: "https://de.serlo.org/"
    publisher: "Serlo Education e.V. / Gesellschaft für freie Bildung e.V. (Terms name the latter as licence holder)"
    scope: "Mathematik (main, Grundschule to Abitur incl. FOS/BOS and Hochschule), Chemie, Physik, Biologie, Informatik and others; all 16 Länder listed in the Mathematik Lehrplan tree"
    content_type: "OER lessons (articles, exercises, courses, videos) plus topic taxonomy"
    format: "html / api-json (GraphQL, AMB JSON-LD)"
    api_or_bulk_access: "Public GraphQL API https://api.serlo.org/___graphql; Metadata API (AMB) described at https://de.serlo.org/metadata; GitHub https://github.com/serlo (120 repos); no dump repo found"
    curriculum_mapping: "Mathematik: 'Themen nach Lehrplan' at /mathe/16030/deutschland lists 16 Bundesländer (14 marked in progress, Bayern populated, NRW with ZP tasks) and Schularten Gymnasium, Realschule, Mittelschule, FOS & BOS, Hochschule; URL pattern /<fach>/<taxonomyId>/<slug>"
    licence: "CC BY-SA 4.0 for contributed content per https://de.serlo.org/terms (some maths exercises carry a different licence note); Metadata API 'Licensed under, CC-BY-SA 4.0' per https://de.serlo.org/metadata"
    use_in_knowledge_base: "full text ingest (filter per-item licence); Bayern Lehrplan tree as structure"
    value_for_topic_coverage: "high"
    verified: "2026-11-07"
    notes: "Per-Land Lehrplan trees mostly placeholders in Nov 2026; Chemie/Physik depth not checked this session. No anti-scraping clause in terms. Prefer Metadata API over scraping."

  - name: "WirLernenOnline (WLO)"
