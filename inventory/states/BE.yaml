    text: "No rights statement for documents; footer only 'Berlin.de ist ein Angebot des Landes Berlin'."
    url: "https://www.berlin.de/sen/bildung/unterricht/faecher-rahmenlehrplaene/rahmenlehrplaene/klasse-1-10/"
    explicit_open_licence: null
  school_structure:
    primary_grades: "1-6 (Grundschule; Naturwissenschaften 5/6 and Gesellschaftswissenschaften 5/6 in grades 5-6)"
    sek1_school_forms: ["Integrierte Sekundarschule (ISS)", "Gemeinschaftsschule", "Gymnasium"]
    gymnasium_model: "G8 at Gymnasium (Abitur after grade 12); ISS and Gemeinschaftsschule lead to Abitur after grade 13 (Einführungsphase grade 11, Qualifikationsphase 12-13 per berlin.de Oberstufe page). G8/G9 label itself not taken from a fetched regulation."
    sek2_forms: ["Gymnasiale Oberstufe am Gymnasium", "Gymnasiale Oberstufe an ISS und Gemeinschaftsschule", "Berufliches Gymnasium", "Kolleg / Abendgymnasium (Zweiter Bildungsweg, excluded)"]
    integrated_science_lower_sek1: "Naturwissenschaften 5/6 (Grundschule grades 5-6, RLP Teil C Nawi 5-6); Naturwissenschaften 7-10 exists only as Wahlpflicht"
    chemistry_starts_grade: 7
    physics_starts_grade: 7
    stundentafel_url: "unverified: Sekundarstufe I-Verordnung (Sek I-VO) Anlagen and Grundschulverordnung (GsVO) Anlage on gesetze.berlin.de; not fetched"
    weekly_hours_note: "Not extracted. Biologie: Teil C covers grades 7-10, grades 5-6 within Naturwissenschaften 5/6 (hours not extracted). Politik: Gesellschaftswissenschaften 5/6 in grades 5-6, Politische Bildung 7-10, Wahlpflicht SoWi-WiWi 9-10, GOST courses Politikwissenschaft, Politische Bildung, Sozialwissenschaften, Wirtschaftswissenschaft (hours not extracted). WAT: grades 7-10 at ISS (hours not extracted)."
