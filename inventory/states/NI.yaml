  notes: "In Sek I Chemie and Physik have no stand-alone Kerncurricula; they are Fachteile of the KC Naturwissenschaften of each school form. KGS uses the Kerncurricula of HS, RS and Gymnasium per Zweig. Several Sek I KCs date from 2013 to 2015; an ongoing revision wave (Englisch, Religion 2026) has not yet reached Mathematik Sek I or Naturwissenschaften. Draft Neufassungen of the school-form Erlasse (Gymnasium 5-10, Hauptschule) are in consultation. Berufsbildende Schulen and Förderschulen excluded. Additions 2026-11-07: Biologie (Sek II KC 2022; Sek I only within NaWi) and Politik/Wirtschaft (Politik HS/RS/OBS, Politik-Wirtschaft Gymnasium and Sek II, Wirtschaft HS/RS/OBS, Gesellschaftslehre IGS) plus AWT IGS 2024 appended from the cuvo index. Werte und Normen deliberately excluded. Technik and Hauswirtschaft KCs (HS/RS/OBS) not inventoried."
