      url: "https://www.hamburg.de/bildungsplaene"
      kind: "pdf_index"
      robots_txt: "User-agent * disallows only /branchenbuch, /iason, /befi, /premiumpartner, /search, /newsletter; many scraper bots (HTTrack, scrapy, MJ12bot, SemrushBot, PetalBot) fully disallowed; Sitemap https://www.hamburg.de/service-sitemap-hamburg.de-sitemap_index.xml (verified 2026-11-07)"
      export_or_api: "None; XML sitemap available."
      scraper_notes: "Server-rendered CMS. Subpages per school form (start-grundschule-122924, stadtteilschule-2022-122976, gym-seki-122942, start-sek2-2022-123118 under /politik-und-verwaltung/behoerden/bsfb/veroeffentlichungen/bildungsplaene/). PDFs on dokumente.hamburg.de/resource/blob/<id>/<hash>/<name>-data.pdf; hash is part of the URL, so harvest from subpages. Blob IDs 122xxx/123xxx = 2022 plans, 798xxx = 2023/2024 plans. Use a non-blocked user agent."
