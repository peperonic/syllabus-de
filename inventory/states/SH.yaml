  notes: "Fachanforderungen generation of 2014 onward replaced the Lehrpläne of 1997/2002. Mid-transition in Nov 2026: Mathematik 2024 editions phase in from 2024/25, Chemie and Physik 2026 editions from 2026/27; the older editions remain valid for cohorts already in the subject. Chemie/Physik 1st edition (2016) and 2nd edition (2019) are außer Kraft and listed on the overview page; historical Lehrpläne 1997/98 and 2002/03 also listed. Most documents exist in a normal and a 'barrierearm' PDF version. Regionalschule appears only in the title of the Kontingentstundentafel Erlass and is not a current Sek I school form. Berufliche Schulen (SHIBB Lehrplanportal) and Förderschulen excluded. No em dashes used. Additions 2026-11-07 (Biologie, Politik/Wirtschaft, Arbeitslehre/WAT): Biologie Sekundarstufe 2026 (phasing in from 2026/27, Sek II unchanged from 2023) and 2023 (phasing out); Wirtschaft/Politik Sekundarstufe 2016 (current) with Anhörungsfassung 2026 (Sek I, planned 2027/28); Weltkunde Sek I 2015; Wirtschaftslehre Lehrplan (old, validity unclear); Verbraucherbildung Sek I 2019. Politik/Wirtschaft subject pages live under /sh/fachanforderungen/<fach>.html."
