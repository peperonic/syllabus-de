  notes: "Major transition: GOSt Kernlehrpläne 2026 (published 28.08.2026) take effect 01.08.2027 with EF and replace the 2022 (Bio/Ch/Ph) and 2023 (Mathematik) editions auslaufend from 31.07.2027. Heft numbers (4720, 4721, 4723) are reused across editions. Sekundarschule uses Gesamtschule Kernlehrpläne. G9 Sek I PDF URLs on the new Lehrplannavigator host could not be determined because the page body is not extractable via text fetch. Berufskolleg, Weiterbildungskolleg and Förderschule excluded. Additions 2026-11-07: Biologie, Politik/Wirtschaft (Wirtschaft-Politik, Politik, Wirtschaft, Gesellschaftslehre, Sozialwissenschaften, Sozialwissenschaften/Wirtschaft) and Arbeitslehre/WAT (Wirtschaft und Arbeitswelt, Hauswirtschaft, Technik) appended; Sek I social science plans 2020/2022 for all non-Gymnasium forms, GOSt SoWi and Biologie 2026 upcoming from 01.08.2027."
