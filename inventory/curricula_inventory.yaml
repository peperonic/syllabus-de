  legal_basis:
    instrument: Not located. bildung-mv.de pages give validity only in link titles ('gültig ab', 'aufwachsend', 'auslaufend');
      the Verwaltungsvorschrift putting the 2024/2026 plans in force (expected in the Mitteilungsblatt des Ministeriums, Mittl.bl.
      BM M-V) was not found because regierung-mv.de Mitteilungsblatt downloads now redirect to the land-mv.de start page.
      RP Mathematik 1-4 2024 calls itself a 'rechtsverbindliche Grundlage' (section 1.1) but cites no instrument.
    paragraph_5_urhg_assessment: 'Abs. 2 likely (assessment): official works published by the ministry in the official interest
      for general information; Abs. 1 would require the plan text to be part of a promulgated Verwaltungsvorschrift, which
      is unverified. Not legal advice.'
    evidence_url: https://www.bildung-mv.de/unterricht/rahmenplaene/rahmenplaene-fuer-die-allgemein-bildenden-faecher/chemie/index.html
