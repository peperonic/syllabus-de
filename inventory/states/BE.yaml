  legal_basis:
    instrument: "Not located. berlin.de only states that RLP became 'unterrichtswirksam' in given school years; no Bekanntmachung, Rundschreiben or Amtsblatt reference found. Expected: SenBJF instrument under § 10 SchulG Berlin (unverified)."
    paragraph_5_urhg_assessment: "Abs. 2 likely (assessment): instrument unknown; documents identical to Brandenburg's, where a Verwaltungsvorschrift incorporates them by reference, so Abs. 1 is arguable."
