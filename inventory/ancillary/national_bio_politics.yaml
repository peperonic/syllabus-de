  - name: "KMK Weiterentwickelte Bildungsstandards in den Naturwissenschaften für das Fach Biologie (MSA) (Beschluss 16.12.2004 i.d.F. 13.06.2024)"
    url: "https://www.kmk.org/fileadmin/Dateien/veroeffentlichungen_beschluesse/2024/2024_06_13-WeBiS_Biologie_MSA.pdf"
    publisher: "Sekretariat der KMK (since 2025 Bildungsministerkonferenz); prepared by IQB with Länder experts"
    scope: "Biologie, MSA (end Jg. 10), all Länder; no ESA standards exist for Biologie"
    content_type: "standards document"
    format: "pdf"
    api_or_bulk_access: "none"
    curriculum_mapping: "Kompetenzbereiche Sachkompetenz (S 1 Biologische Sachverhalte betrachten, S 2 Lebende Systeme betrachten), Erkenntnisgewinnungskompetenz (E 1 Arbeitstechniken, E 2 kriteriengeleitet beobachten/vergleichen/ordnen, E 3 hypothesengeleitet experimentieren, E 4 modellieren, E 5 Erkenntnisprozess reflektieren), Kommunikationskompetenz (K 1-K 3), Bewertungskompetenz (B 1-B 3); 6 Basiskonzepte (Struktur und Funktion; Stoff- und Energieumwandlung; Information und Kommunikation; Steuerung und Regelung; Individuelle Entwicklung; Evolutive Entwicklung); 4 verbindliche inhaltliche Bereiche: Lebewesen bestehen aus Zellen (Kennzeichen des Lebendigen, Zellen, Mitose, Meiose, Fotosynthese und Zellatmung, Enzymreaktion), Vielfalt und Veränderung von Lebewesen (Evolutionstheorie, Vererbung, genetische Variabilität, Angepasstheit, Artbildung, Verwandtschaft, Stammesgeschichte des Menschen), Der Mensch als Lebewesen (Organsysteme, Immunabwehr, Impfung, Gesundheitsbildung, Ernährung, Suchtprävention, Sexualbildung und Diversität, Pubertät, Fortpflanzung), Lebewesen in ihrer Umwelt (Ökosysteme, Biodiversität, Naturschutz, Artenkenntnis, Kohlenstoffkreislauf, Energiefluss und Trophiestufen, Klimawandel, Nachhaltigkeit); AB I-III; no implementation Schuljahr; first IQB check Bildungstrend 2030"
    licence: "unclear; no notice in PDF; kmk.org Nutzungsbedingungen restrictive (https://www.kmk.org/impressum.html)"
    use_in_knowledge_base: "structure only"
    value_for_topic_coverage: "high"
    verified: "2026-11-07"
    notes: "Listed on KMK Bildungsstandards page together with the 2004 Bio/Che/Phy Vereinbarung (already in national.yaml) and the Implementationsbroschüre Naturwissenschaften 2024 (already in national.yaml notes). Best national checklist of Sek I Biologie topics; compare with Land Lehrpläne still built on the 2004 standards (4 Kompetenzbereiche Fachwissen, Erkenntnisgewinnung, Kommunikation, Bewertung; 3 Basiskonzepte System, Struktur und Funktion, Entwicklung in 2004 version, from prior knowledge, unverified)."

