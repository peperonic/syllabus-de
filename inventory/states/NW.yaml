schema: curricula-inventory/v1
state:
  code: "NW"
  name: "Nordrhein-Westfalen"
  ministry:
    name: "Ministerium für Schule und Bildung des Landes Nordrhein-Westfalen (MSB)"
    url: "https://www.schulministerium.nrw/"
  curriculum_institute:
    name: "Qualitäts- und UnterstützungsAgentur - Landesinstitut für Schule NRW (operates the Lehrplannavigator and Standardsicherung portals)"
    abbrev: "QUA-LiS NRW"
    url: "https://lehrplannavigator.nrw.de/"
  curriculum_terms: ["Kernlehrplan (KLP)", "Lehrplan (Primarstufe)", "Richtlinien und Lehrpläne", "Heft-Nr. (Schriftenreihe Schule in NRW)", "schulinterner Lehrplan (SiLP)", "Lehrplannavigator"]
  legal_basis:
    instrument: "Runderlass (RdErl.) des MSB under § 29 SchulG NRW, published in ABl. NRW and collected in BASS (15-1 Primarstufe, 15-24 Gesamtschule/Sekundarschule, 15-25 Gymnasium Sek I, 15-31 GOSt). Wording: 'werden hiermit Kernlehrpläne gemäß § 29 SchulG festgesetzt'. Key RdErl.: 01.07.2021 (Primarstufe, ABl. 07/21); 23.06.2019 (Gymnasium Sek I, ABl. 07/19); 02.06.2022 (Mathematik GE/SK, ABl. 06/22); 31.05.2022 (GOSt Bio/Ch/Ph, ABl. 06/22); 24.05.2023 (GOSt Mathematik, ABl. 06/23); 07.08.2026 (GOSt all subjects, in force 01.08.2027, ABl. 08/26)."
    paragraph_5_urhg_assessment: "Abs. 1 arguable for the enacting RdErl. (it 'setzt fest' the plans); Abs. 2 likely for the separately published Kernlehrplan text (assessment, not legal advice)."
    evidence_url: "https://bass.schule.nrw/Inhalt/18579.htm"
  licence_notice:
    text: "Lehrplannavigator Impressum: contents 'unterliegen in der Regel dem Schutz des Urheberrechts'; reproduction/distribution 'ohne schriftliche Genehmigung untersagt'; mentions 'einer eventuellen, für einzelne Werke anwendbaren Creative Commons-Lizenz'. The checked GOSt Mathematik 2014 PDF carries no copyright statement. BASS footer: '© 2026 Ministerium für Schule und Bildung'."
    url: "https://lehrplannavigator.nrw.de/impressum"
    explicit_open_licence: false
  school_structure:
    primary_grades: "1-4 (Grundschule)"
    sek1_school_forms: ["Hauptschule", "Realschule", "Gesamtschule", "Sekundarschule (uses Gesamtschule Kernlehrpläne)", "Gymnasium", "PRIMUS-Schule (Schulversuch, not separately covered)"]
    gymnasium_model: "G9 at Gymnasium since 2019/20 (Sek I grades 5-10, GOSt EF 11, Q1/Q2 12-13); Gesamtschule GOSt 11-13. First G9 Abitur 2027 (inferred)."
    sek2_forms: ["Gymnasiale Oberstufe am Gymnasium", "Gymnasiale Oberstufe an der Gesamtschule", "Weiterbildungskolleg (excluded)", "Berufskolleg / berufliches Gymnasium (excluded)"]
    integrated_science_lower_sek1: "Hauptschule, Realschule, Gesamtschule, Sekundarschule: Lernbereich Naturwissenschaften (integrated in 5/6; Gesamtschule may continue integrated 'Naturwissenschaften' up to 10). Gymnasium: separate subjects (inferred from APO-S I, not re-verified)."
    chemistry_starts_grade: 7
    physics_starts_grade: 6
    stundentafel_url: "unverified: https://recht.nrw.de/system/files/BHA/25865-40985-sgv_223_20121102_1_anlage3a.pdf (APO-S I Anlage 3a, search-found); https://www.schulministerium.nrw/system/files/media/document/file/Stundentafel_SI_G9_Anlage_3a_auslaufend.pdf (search-found)"
    weekly_hours_note: "Not extracted. Start grades (Physik 6, Chemie 7 at Gymnasium; separate sciences from 7 at HS/RS/GE) are inferred from prior knowledge of APO-S I, not re-verified. Biologie: Gymnasium G9 grades 5-10 (separate subject); HS/GE/SK within Naturwissenschaften; Realschule separate Biologie 5-10. Politik/Wirtschaft: Wirtschaft-Politik Gymnasium 5-10; Realschule Politik and Wirtschaft 5-10; Gesamtschule/Sekundarschule Gesellschaftslehre 5-10; Hauptschule Gesellschaftslehre 5-10; Wahlpflicht Wirtschaft/Sozialwissenschaften from 7 (RS), Wirtschaft from 9 (Gymnasium G9). Arbeitslehre/WAT: Hauptschule Wirtschaft und Arbeitswelt 5-10; GE/SK Hauswirtschaft and Technik 5-10, WP Wirtschaft und Arbeitswelt from 7 (grade ranges from in-force rules, hours not extracted)."
  portals:
    - name: "Lehrplannavigator NRW (QUA-LiS)"
      url: "https://lehrplannavigator.nrw.de/"
      kind: "pdf_index"
      robots_txt: "Drupal default: Disallow /core/, /profiles/, /admin/, /search/, /user/..., README files; no Sitemap line; /system/files/ not disallowed (verified 2026-11-07)"
      export_or_api: "None found."
      scraper_notes: "Drupal CMS, server-rendered. Old host schulentwicklung.nrw.de/lehrplaene/ 302-redirects here; old PDF URLs redirect to a landing page, not the file. PDFs at /system/files/media/document/file/<name>.pdf (some on www.qua-lis.nrw.de with the same path); names follow <form>_<subject>_klp_<Heft>_<date>.pdf with occasional Drupal '_0' suffixes, so harvest hrefs from subject pages. Subject pages output about 68,000 characters of repeated menu; parse the main node body from HTML, text dumps do not reach the download block. Whether the full KLP text is also offered as HTML not confirmed."
    - name: "BASS (Bereinigte Amtliche Sammlung der Schulvorschriften NRW)"
      url: "https://bass.schule.nrw/"
      kind: "html_pages"
      robots_txt: null
      export_or_api: "Per-entry PDF at /pdf/<id>.pdf; Gültigkeitsliste at /Service/Gueltigkeitsliste."
      scraper_notes: "Static HTML per Erlass (/Inhalt/<id>.htm or /<id>.htm); contains RdErl. date, Az, ABl. reference, Heft numbers, in-force and expiry rules."
    - name: "Standardsicherung NRW (ZP10, Zentralabitur)"
      url: "https://www.standardsicherung.schulministerium.nrw.de/"
      kind: "pdf_index"
      robots_txt: null
      export_or_api: null
      scraper_notes: "Drupal, same /system/files/media/document/file/ pattern; login link present, access to past papers not confirmed."
