  legal_basis:
    instrument: 'VwV Stundentafeln: Verwaltungsvorschrift des SMK über Lehrpläne und Stundentafeln für Grundschulen, Förderschulen,
      Oberschulen, Gymnasien (Sekundarstufe I) ... vom 20. Juni 2018 (MBl. SMK S. 347), zuletzt geändert 23. Juli 2026 (MBl.
      SMK S. 118). Ziffer II: Lehrpläne laut jährlicher Landesliste der Lehrpläne sind anzuwenden. Oberstufe: OAVO (revosax
      9362).'
    paragraph_5_urhg_assessment: 'Abs. 2 likely (assessment): Lehrpläne are incorporated by reference through the VwV and
      the annually published Landesliste; Abs. 1 arguable because the VwV makes them binding.'
    evidence_url: https://revosax.sachsen.de/vorschrift_gesamt/17744/49961.html
  licence_notice:
    text: 'Fetched Lehrplan PDFs carry an Impressum (Herausgeber: Sächsisches Staatsministerium für Kultus, Dresden; download
      via schulportal.sachsen.de/lplandb/) but no copyright or licence statement. Portal terms not seen (index robots-disallowed).'
