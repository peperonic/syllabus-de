    name: "Ministerium für Bildung Rheinland-Pfalz (BM); earlier documents issued by MBWJK (2007) and MBWWK (2014)"
    url: "https://bm.rlp.de/"
  curriculum_institute:
    name: "Pädagogisches Landesinstitut Rheinland-Pfalz (PL), Speyer; operates the Bildungsserver and Lehrplan portal on behalf of the Ministerium für Bildung (Referat 9311)"
    abbrev: "PL"
    url: "https://bildung.rlp.de/lehrplaene"
  curriculum_terms: ["Lehrplan", "Rahmenlehrplan", "Rahmenplan Grundschule", "Teilrahmenplan", "Themenfeld", "Mainzer Studienstufe (MSS)", "Grundfach", "Leistungsfach", "Lehrplananpassung"]
  legal_basis:
    instrument: "Not located. Expected: Verwaltungsvorschrift / Bekanntmachung des Ministeriums published in the Amtsblatt des Ministeriums für Bildung (archive bm.rlp.de/fileadmin/09/05_Service/Dokumente/Amtsblatt/Archiv/). Teilrahmenplan Mathematik Grundschule states it 'tritt zum 01.08.2015 in Kraft'. Amtsblatt January 2026 contains no general-education Lehrplan items."
    paragraph_5_urhg_assessment: "Unclear (assessment): Abs. 1 arguable for VwV-enacted Lehrplan text; PDFs carry '© Ministerium' and the portal forbids commercial distribution."
    evidence_url: "https://ors.bildung-rp.de/fileadmin/user_upload/ors.bildung-rp.de/Faecher/Mathematik/Rahmenplan_Grundschule_TRP_Mathe_01_08_2015.pdf"
  licence_notice:
    text: "Distribution 'für Zwecke von Schulen und Weiterbildung erwünscht' with source and URL; 'ist eine kommerzielle Verbreitung der auf diesem Server liegenden Dokumente ausdrücklich untersagt' without written permission; copyright remains with the provider; no Creative Commons."
    url: "https://bildung.rlp.de/ueber-bildungrlpde/impressum"
    explicit_open_licence: false
  school_structure:
    primary_grades: "1-4 (Grundschule)"
    sek1_school_forms: ["Realschule plus (since 2009; replaced Hauptschule, Realschule, Regionale Schule)", "Integrierte Gesamtschule (IGS)", "Gymnasium"]
    gymnasium_model: "G9 (MSS Jahrgangsstufen 11-13: Einführungsphase 11/1 and 11/2, Qualifikationsphase 12-13); G8GTS at some Ganztagsgymnasien (MSS Jgst 10-12)."
    sek2_forms: ["Mainzer Studienstufe (MSS) at Gymnasium and IGS", "Berufliches Gymnasium (excluded)"]
    integrated_science_lower_sek1: "Naturwissenschaften Klassen 5/6 (Rahmenlehrplan Naturwissenschaften); Biologie, Chemie, Physik as separate subjects from Klasse 7 (2014 Lehrplan for Klassenstufen 7-9/10). Inferred."
    chemistry_starts_grade: 7
    physics_starts_grade: 7
    stundentafel_url: "https://bildung.rlp.de/fileadmin/user_upload/realschuleplus.bildung.rlp.de/Service/Rechtliche_Grundlagen/VV_Stundentafel_RS_plus.pdf"
    weekly_hours_note: "Realschule plus (VV of 7 April 2009, effective 1 Aug 2009, Az. 941 B - Tgb.Nr. 969/08): Mathematik 8 h in Kl. 5-6 and 16-17 in Kl. 7-10; Naturwissenschaften 7 h in 5-6 and 16 in 7-10 (Physik/Chemie/Biologie not separated). MSS: Leistungsfach usually 5 h, Grundfach 3 h. Gymnasium and IGS Stundentafeln not located. Start grades 7 inferred from the 2014 Lehrplan scope; actual start may vary by school form. New subjects: Biologie integrated in Naturwissenschaften Kl. 5/6, separate from Kl. 7; Sozialkunde per 1998 Lehrplan in Gymnasium Kl. 9-10, Realschule 8-10, Hauptschule 7-9 (19 h Gesellschaftswissenschaften combined in Sek I at Realschule plus, IGS, Gymnasium); Gesellschaftslehre Kl. 5-10 at IGS/Realschule plus; Realschule plus Wahlpflichtfach (incl. Wirtschaft und Verwaltung) Kl. 6-10."
  portals:
