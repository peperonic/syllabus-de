  legal_basis:
    instrument: 'Runderlass (RdErl.) des MSB under § 29 SchulG NRW, published in ABl. NRW and collected in BASS (15-1 Primarstufe,
      15-24 Gesamtschule/Sekundarschule, 15-25 Gymnasium Sek I, 15-31 GOSt). Wording: ''werden hiermit Kernlehrpläne gemäß
      § 29 SchulG festgesetzt''. Key RdErl.: 01.07.2021 (Primarstufe, ABl. 07/21); 23.06.2019 (Gymnasium Sek I, ABl. 07/19);
      02.06.2022 (Mathematik GE/SK, ABl. 06/22); 31.05.2022 (GOSt Bio/Ch/Ph, ABl. 06/22); 24.05.2023 (GOSt Mathematik, ABl.
      06/23); 07.08.2026 (GOSt all subjects, in force 01.08.2027, ABl. 08/26).'
    paragraph_5_urhg_assessment: Abs. 1 arguable for the enacting RdErl. (it 'setzt fest' the plans); Abs. 2 likely for the
      separately published Kernlehrplan text (assessment, not legal advice).
    evidence_url: https://bass.schule.nrw/Inhalt/18579.htm
