  school_structure:
    primary_grades: 1-4 (Grundschule)
    sek1_school_forms:
    - Orientierungsstufe 5-6 (schulartunabhängig)
    - Regionale Schule
    - Gesamtschule (integriert und kooperativ)
    - Gymnasium
    gymnasium_model: 'G8 (Abitur after grade 12): KontStTVO treats grade 10 at Gymnasium as Einführungsphase of the gymnasiale
      Oberstufe; Sek II plans cover 11-12. G8 label itself not taken from a fetched regulation.'
    sek2_forms:
    - Gymnasiale Oberstufe am Gymnasium
    - Gymnasiale Oberstufe an Gesamtschulen
    - Fachgymnasium (berufliche Schule, excluded)
    - Abendgymnasium (Zweiter Bildungsweg, excluded)
    integrated_science_lower_sek1: Naturwissenschaften in the Orientierungsstufe 5-6 (integrates Physik, Biologie, Chemie
      per KontStTVO footnote); alternatively Physik as separate subject in Klasse 6 (RP Physik Orientierungsstufe Klasse 6)
    chemistry_starts_grade: 8
    physics_starts_grade: 6
    stundentafel_url: 'unverified (official): Kontingentstundentafelverordnung (KontStTVO M-V) of 27 Apr 2009, Mittl.bl. BM
      M-V p. 6, § 1a newly worded by VO of 1 Feb 2022 (GVOBl. M-V p. 160); read via commercial database https://www.lexaris.de/book/version/documentflat/head/1352141
      ; official landesrecht-mv.de URL not found'
    weekly_hours_note: 'From KontStTVO (Stand 15.06.2023, table partly garbled in source): Mathematik 10 h in Orientierungsstufe
      5-6, 12 h in Regionale Schule 7-10, 8 h (7-9) plus 4 h (10) at Gymnasium. Science is a combined Kontingent: 7 h in 5-6
      (incl. Informatik und Medienbildung, Biologie, Physik or Naturwissenschaften), 17 h Regionale Schule 7-10, 13 h plus
      6 h Gymnasium; Physik and Chemie not split out. Chemie starts grade 8 under old plans and grade 7 under the 2026 plans
      (from 2027/28); physics_starts_grade 6 refers to the Orientierungsstufe Physik option. Biologie: no separate hours;
      part of the naturwissenschaftliche Kontingent (Biologie or Nawi in 5-6, Biologie 7-10, Sek II 11-12). Politik: Sozialkunde,
      Geschichte, Geografie, AWT (or Weltkunde in 5-6) share the gesellschaftswissenschaftliche Aufgabenfeld, 7 h in 5-6,
      15 h Regionale Schule 7-10, 11 h (7-9) plus 6 h (10) Gymnasium; Politische Bildung/Sozialkunde plans cover 7-10 and
      11-12; start grade per subject not readable (§ 6 table garbled). AWT: 7-10 within the same Kontingent; Berufliche Orientierung
      in Sek II grade 11 and as berufsorientierende Wahlpflicht in Sek I (§ 6, hours not specified).'
