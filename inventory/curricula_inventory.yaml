  school_structure:
    primary_grades: 1-4 (Grundschule; Oberschule+ pilot schools 1-10; Gemeinschaftsschule may span 1-12)
    sek1_school_forms:
    - Oberschule (Hauptschul- und Realschulbildungsgang)
    - Oberschule+
    - Gymnasium
    - Gemeinschaftsschule (no own Lehrpläne; uses GS, OS or GY plans by Anforderungsniveau, VwV Ziffer VII)
    gymnasium_model: G8, Abitur after grade 12 (Gymnasium 5-12; Oberstufe Jahrgangsstufen 11-12)
    sek2_forms:
    - Gymnasiale Oberstufe am Gymnasium (Gk/Lk)
    - Gymnasiale Oberstufe an Gemeinschaftsschulen
    - Berufliches Gymnasium (excluded)
    - Abendgymnasium / Kolleg (excluded)
    integrated_science_lower_sek1: None. No Naturwissenschaften subject in the Landesliste 2026/27; Biologie, Physik, Chemie
      taught separately.
    chemistry_starts_grade: 8
    physics_starts_grade: 6
    stundentafel_url: https://revosax.sachsen.de/vorschrift_gesamt/17744/49961.html (Anlagen 1a GS, 3a OS, 4a GY linked, tables
      not reproduced in HTML)
    weekly_hours_note: 'Not extracted. chemistry_starts_grade 8 verified for Oberschule in the Lehrplan PDF; Gymnasium Chemie
      believed to start in grade 7 (unverified). Physik start grade 6 unverified. Biologie: separate subject at Oberschule
      5-10 and Gymnasium 5-12 (Oberschule range unverified). Politik/Wirtschaft: Gemeinschaftskunde/Rechtserziehung at Oberschule
      Kl. 7-10, GRW at Gymnasium Kl. 7-12 (verified in PDFs). Arbeitslehre/WAT: WTH at Oberschule Kl. 7-9, Technik/Computer
      at Oberschule Kl. 5-6 (verified).'
