- code: HE
  name: Hessen
  ministry:
    name: Hessisches Ministerium für Kultus, Bildung und Chancen (HMKB)
    url: https://kultus.hessen.de/unterricht/kerncurricula-und-lehrplaene
  curriculum_institute:
    name: Hessische Lehrkräfteakademie (develops KC, publishes erläuternde Texte and Leitfäden; documents hosted by the ministry)
    abbrev: LA
    url: https://lehrkraefteakademie.hessen.de/schule-und-unterricht/kerncurricula-lehrplaene-und-bildungsstandards
  curriculum_terms:
  - Kerncurriculum (KC)
  - Kerncurriculum für die gymnasiale Oberstufe (KCGO)
  - Bildungsstandards und Inhaltsfelder
  - Leitfaden
  - Lehrplan (older, used where no Schulcurriculum)
  - Schulcurriculum
  - Themenfeld
  - Grundkurs / Leistungskurs
  legal_basis:
    instrument: KCGO cite HSchG §§ 2, 3, 6 Abs. 4 and OAVO § 7 Abs. 7, § 8 Abs. 2; KC Primarstufe and Sek I binding since
      2011/12, KCGO since 2016/17, revised KCGO in force from the half-year change 2024/25 (Einführungsphase). Expected Inkraftsetzung
      by Erlass published in the Amtsblatt des HKM; no Erlass or ABl. citation retrieved. Statutory anchor for Kerncurricula
      in HSchG (likely § 4) not verified.
    paragraph_5_urhg_assessment: 'Unclear (assessment): Abs. 1 arguable if enacted by amtlicher Erlass; Abs. 2 at minimum.
      Ministry Impressum claims copyright and forbids online republication without approval.'
    evidence_url: https://kultus.hessen.de/sites/kultus.hessen.de/files/2025-10/kerncurriculum_gymnasiale_oberstufe-mathematik.pdf
  licence_notice:
    text: '''Die Gestaltung der Internetseiten sowie die inhaltlichen Beiträge sind urheberrechtlich geschützt''; reuse requires
      prior approval (oeffentlichkeitsarbeit@kultus.hessen.de); downloads may be copied physically but not made available
      online. No CC or open data licence.'
    url: https://kultus.hessen.de/impressum
    explicit_open_licence: false
  school_structure:
    primary_grades: 1-4 (Grundschule)
    sek1_school_forms:
    - Hauptschule
    - Realschule
    - Verbundene Haupt- und Realschule / Mittelstufenschule
    - Kooperative Gesamtschule (KGS)
    - Integrierte Gesamtschule (IGS)
    - Gymnasium
    gymnasium_model: Predominantly G9 (schools could choose G8 or G9 from 2013/14); Oberstufe Einführungsphase E plus Qualifikationsphase
      Q1-Q4 with Grundkurs and Leistungskurs. Knowledge, partly unverified.
    sek2_forms:
    - Gymnasiale Oberstufe (Gymnasium, Oberstufengymnasium, Gesamtschule mit Oberstufe)
    - Berufliches Gymnasium (excluded)
    - Fachoberschule (excluded)
    integrated_science_lower_sek1: No state integrated-science KC; Stundentafel groups Biologie, Chemie, Physik as 'Lernbereich
      Naturwissenschaften' with school-level distribution of hours.
    chemistry_starts_grade: null
    physics_starts_grade: null
    stundentafel_url: https://verkuendung.hessen.de/sites/verkuendung.hessen.de/files/veroeffentlichungsplattform_plugin/published/732/GVBl_2025_Nr_2_Regelungstext.pdf
    weekly_hours_note: 'Only the Zweite Änderungsverordnung vom 9. Januar 2025 (GVBl. 2025 Nr. 2) to the Verordnung über die
      Stundentafeln für die Primarstufe und die Sekundarstufe I (2011, ABl. S. 653) was retrieved; consolidated hours not
      extracted. Start grades of Chemie and Physik vary by school (commonly Physik 6 or 7, Chemie 7 or 8; unverified). New
      subjects: Biologie, Politik und Wirtschaft and Arbeitslehre KC exist per Bildungsgang (Arbeitslehre only Hauptschule
      and Realschule); start grades not extracted from the Stundentafel (commonly Biologie from 5, PoWi from 7 at Gymnasium;
      unverified).'
