    instrument: '§ 4 HmbSG (Bildungspläne): Abs. 4 Bildungspläne are ''durch die zuständige Behörde für verbindlich erklärt''
      and to be published ''in allgemein zugänglicher Form''; the Senat may regulate the drafting procedure by Verordnung.
      HmbSG of 16.4.1997 (HmbGVBl. S. 97), last amended 27.5.2024 (HmbGVBl. S. 124). The Bekanntmachung/declaration text and
      date for the 2022-2024 plans were not located; publication is on hamburg.de, no Amtsblatt reference seen.'
    paragraph_5_urhg_assessment: 'Abs. 2 likely (assessment, not legal advice): plans declared binding and published to general
      notice by the Behörde; Abs. 1 arguable only for the declaring act.'
    evidence_url: https://dokumente.hamburg.de/resource/blob/670906/c44114c85332da6e1b53c083d3cacebc/hamburgisches-schulgesetz-hmbsg--data.pdf
  licence_notice:
    text: 'Plan PDFs print ''Alle Rechte vorbehalten'' in the Impressum (checked: Allgemeiner Teil, Lernbereich NuT Stadtteilschule,
      Chemie Gymnasium). hamburg.de footer ''© hamburg.de 2026''; Impressum mentions possible separate Nutzungsbedingungen
      for content of the Freie und Hansestadt Hamburg.'
    url: https://www.hamburg.de/impressum-240706
    explicit_open_licence: false
  school_structure:
