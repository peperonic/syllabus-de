    instrument: 'Erlass (and pre-announcing Mitteilung) of the Senator für Kinder und Bildung; e.g. Erlass 3/2026 of 15.06.2026:
      ''werden die folgend tabellarisch aufgeführten Bildungspläne zum 01.08.2026 erlassen'', publication on the LIS homepage.
      School-form Verordnungen delegate the standards to the Bildungspläne (Oberschulverordnung § 2 Abs. 3; Grundschulverordnung
      § 2), based on BremSchulG (§ 20 Abs. 3, § 21 Abs. 2, § 45 with § 42 and § 67 cited in the Oberschulverordnung). No Amtsblatt
      publication for plans seen.'
