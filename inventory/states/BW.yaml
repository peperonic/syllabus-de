    name: "Ministerium für Kultus, Jugend und Sport Baden-Württemberg (Kultusministerium, KM)"
    url: "https://km.baden-wuerttemberg.de/"
  curriculum_institute:
    name: "Zentrum für Schulqualität und Lehrerbildung (ZSL), Stuttgart; named as Herausgeber of the Bildungsplan portal on behalf of the Land. IBBW is not mentioned on the portal."
    abbrev: "ZSL"
    url: "https://www.bildungsplaene-bw.de/"
  curriculum_terms: ["Bildungsplan", "Bildungsplan 2016 (V1)", "überarbeiteter Bildungsplan 2016 (V2)", "Überarbeitete Fassung (V3.0)", "Fachplan", "Gemeinsamer Bildungsplan der Sekundarstufe I", "Bildungsplan der Oberstufe an Gemeinschaftsschulen", "Basisfach", "Leistungsfach", "Beispielcurriculum", "Kompetenzraster"]
  legal_basis:
    instrument: "Bildungspläne put into force by the Kultusministerium; KM letters give entry-into-force dates (5 June 2024, Az. KM31-6510-1/9/25 for Deutsch/Mathematik V2; 22 July 2025, Az. KM31-6510-1/23/1 for V3.0 subjects incl. Chemie, Physik, Mathematik G9 from 1 Aug 2026). Plans contain an 'Inkraftsetzungsformel' (per portal FAQ). Expected form: Verwaltungsvorschrift published in Amtsblatt 'Kultus und Unterricht' (Lehrplanhefte); no K.u.U. citation retrieved (unverified)."
    paragraph_5_urhg_assessment: "Abs. 1 arguable for the Bildungsplan text as amtlicher Erlass (assessment); portal nevertheless asserts 'Alle Rechte vorbehalten' (ZSL). Beispielcurricula and Umsetzungshilfen at most Abs. 2, more likely ordinary protected works."
    evidence_url: "https://km.baden-wuerttemberg.de/fileadmin/redaktion/m-km/intern/PDF/Dateien/Allgemeine_Infos/Bildungsreform/Schreiben_-_Bildungsplanarbeiten_Gesamt%C3%BCberblick.pdf"
  licence_notice:
    text: "Plan pages carry a copyright notice attributing content to the Zentrum für Schulqualität und Lehrerbildung Baden-Württemberg, 'Alle Rechte vorbehalten'. Impressum has no Urheberrecht or licence statement."
    url: "https://www.bildungsplaene-bw.de/,Lde/DE_BW_BILDUNGSPLAENE_GEN2X_BPBW_ALLG_GYM_M%28V3.0%29"
    explicit_open_licence: false
  school_structure:
    primary_grades: "1-4 (Grundschule)"
    sek1_school_forms: ["Werkrealschule / Hauptschule", "Realschule", "Gemeinschaftsschule", "Gymnasium"]
    gymnasium_model: "Transition G8 to G9: G9 is Regelform again from 2025/26 starting with Klassen 5 and 6 (V3.0 plans, Klasse 11 Einführungsphase, 12/13 Leistungsfach/Basisfach); in 2026/27 Klassen 8-12 still taught as G8 under V1/V2 (Oberstufe Klassen 11/12, Leistungsfach/Basisfach since Abitur 2021). Last G8 Abitur and first G9 Abitur dates not verified."
    sek2_forms: ["Gymnasiale Oberstufe am Gymnasium", "Gymnasiale Oberstufe an Gemeinschaftsschulen (own Bildungsplan der Oberstufe)", "Berufliches Gymnasium (excluded)"]
    integrated_science_lower_sek1: "BNT (Biologie, Naturphänomene und Technik), Klassen 5/6, Bildungsplan 2016 (Gymnasium and Sek I); dissolved in G9 neu (V3.0) where Biologie, Physik, Chemie are taught as separate subjects."
    chemistry_starts_grade: 8
    physics_starts_grade: 7
    stundentafel_url: "https://www.landtag-bw.de/resource/blob/556672/50245cf2631eed28364b8b8967b0487c/17_8202_D.pdf"
    weekly_hours_note: "G9 neu (Landtag Drs. 17/8202, Klassen 5-11): Mathematik 25 (5-4-4-3-3-3-3), Physik 10, Chemie 7, Biologie 10; NIT Profilfach 3 h in Klassen 8-11; instrument 'Stundentafelverordnung Gymnasien' (text not located). Start grades given for Gymnasium G9 (Physik 7, Chemie 8, inferred from Beispielcurricula bands); Sek I Physik and Chemie from Klasse 7 (inferred). Kontingentstundentafeln for Grundschule and Sek I not checked. New subjects (knowledge unless marked): Biologie in G9 neu from Klasse 5 (BNT dissolved; 10 h over Klassen 5-11, verified Drs. 17/8202), under G8/Sek I V1-V2 from Klasse 7 after BNT 5/6; Gemeinschaftskunde from Klasse 7 (Sek I) and Klasse 8 (Gymnasium G8), Kursstufe Basisfach with optional four semesters since 2023/24; WBS Klassen 7-10 (Sek I) and 8-10 (Gymnasium); Wirtschaft as Kursstufe subject."
  portals:
    - name: "Bildungspläne Baden-Württemberg (Bildungsplanplattform)"
      url: "https://www.bildungsplaene-bw.de/"
      kind: "html_pages"
