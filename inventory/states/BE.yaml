  notes: "Berlin and Brandenburg share RLP 1-10 (since 2017/18) and GOST RLP (since 2022/23); documents are identical but Berlin phases the 2023 Mathematik revision in one year later than Brandenburg. Berlin left the joint LISUM; since 1 Jan 2025 the Bildungsserver is run by Brandenburg's LIBRA on behalf of both states. Berufliche Schulen, Förderschulen and Zweiter Bildungsweg have separate Rahmenlehrpläne and are excluded. No em dashes used. Additions 2026-11-07 (Biologie, Politik/Wirtschaft, Arbeitslehre/WAT): RLP 1-10 Teil C Biologie, Gesellschaftswissenschaften 5/6, Politische Bildung, WAT and Berlin-only Wahlpflicht SoWi-WiWi 9-10 (all 2015); GOST Teil C Biologie (2021/22, ländergemeinsam), Berlin-only Teil C Politikwissenschaft, Sozialwissenschaften, Wirtschaftswissenschaft (older fachliche Vorgaben) and new Teil C Politische Bildung from 2026/27 (Klasse 11). Berlin GOST Geschichte also has a new Teil C from 2026/27 (out of scope)."
