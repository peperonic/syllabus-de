    stundentafel_url: "https://www.gesetze-bayern.de/Content/Document/BayGSO-ANL_1"
    weekly_hours_note: "Start grades given for Gymnasium (Physik 8; Chemie 9, Jgst 8 at NTG). Realschule Physik from 7 (WPFG I) or 8 (II/III), Chemie from 8 (I) or 9 (II/III). Gymnasium (GSO Anlage 1, valid from 01.08.2026): Mathematik 4/4/4/3/4/3/3 Jgst 5-11; NT 3/3/2; Physik 2 h Jgst 8-11; Chemie 2/3 Jgst 9-10 or 2/2/2/2 Jgst 8-11 (NTG); Jgst 12/13 in GSO Anlage 3 (not fetched). Realschule (BayRSO Anlage 1, https://www.gesetze-bayern.de/Content/Document/BayRSO-ANL_1): Mathematik I 5/5/4/4/5/5, II/III 5/5/3/3/3/4; Physik I 2/2/3/3 (7-10), II/III 2/2/2 (8-10); Chemie I 2/2/2 (8-10), II/III 2/2 (9-10). Mittelschule (MSO Anlage 1, https://www.gesetze-bayern.de/Content/Document/BayMSO-ANL_1): Mathematik 5/5/5/4/5/5; NT 2/2/2/3/3/3. Grundschule (GrSO Anlage) not fetched. by_hours.txt New subjects (GSO, BayRSO, MSO Anlage 1, verified): Gymnasium Biologie 2 h Jgst 8-10 (Jgst 5-7 in Natur und Technik), Politik und Gesellschaft 1/2 h Jgst 10-11 (SWG 3/2/2/3 from Jgst 8), Wirtschaft und Recht 2/2 h Jgst 10-11 (WWG 3/2/2/3 from Jgst 8), both continued in Jgst 12/13; Realschule Biologie 2 h Jgst 5-8 and 10, Politik und Gesellschaft 2 h Jgst 10, Wirtschaft und Recht Jgst 9 (II: 8-9), BwR Jgst 7-10 (II) or 7-8 (IIIa); Mittelschule Geschichte/Politik/Geographie 2/2/3/3/3/3 and Wirtschaft und Beruf 1/1/1/2/2/2 Jgst 5-10, Wirtschaft und Kommunikation from Jgst 7."
