      bleibt allein beim Anbieter''; reuse in other publications ''ist ohne ausdrückliche Zustimmung des Anbieters und Betreibers
      nicht gestattet''. The Rahmenplan PDFs checked (Mathematik 1-4 2024, Mathematik Sek II 2019) carry no copyright or licence
