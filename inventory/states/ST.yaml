  notes: "Sachsen-Anhalt structures Lehrpläne as Grundsatzband plus Fachlehrpläne per Schulform with Kompetenzschwerpunkte per Doppeljahrgang. New Grundschule plans in force 01.08.2026; new Sekundarschule plans due 2027/28. Explicit CC licences make ST the most reuse-friendly of the four states. Berufliche Schulen and Förderschulen excluded. No em dashes used."
