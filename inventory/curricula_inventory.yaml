      19; Stadtteilschule Mathematik 26, NuT 18 (bis Jg 9: 15). Biologie: separate from Jg 7 (5-6 within NuT) at both forms,
      Studienstufe. Politik/Wirtschaft: STS Lernbereich Gesellschaftswissenschaften integrated 5-10, PGW Fachrahmenplan 5-11;
